# ============================================================
# Invoice Bot - Configuration Template
# ============================================================
# Copy this file to config.yaml and fill in your values.
#
# Secrets (API keys, client IDs) should be set via environment
# variables — see .env.example. They can also be set here, but
# env vars take precedence when both are present.
# ============================================================

microsoft:
  # Azure App Registration Client ID.
  # Prefer setting via AZURE_CLIENT_ID env var (see .env.example).
  # client_id: "your-client-id"

onedrive:
  # Name of the root folder in OneDrive where invoices will be stored.
  # The bot creates it automatically at the top level of your OneDrive if absent.
  # Subfolders YYYY/MM/ are created automatically.
  folder_name: "YOUR_FOLDER_NAME_HERE"

# ---------------------------------------------------------------------------
# Sources — each entry is a source instance that fetches invoices.
#
# - `module`: which .py file to load from src/sources/ (default: the instance name)
# - `interval_minutes`: if set, APScheduler runs this source on an interval.
#   If absent, the source is triggered externally (systemd timer / cron):
#     python -m sources.run <instance_name>
#
# Multiple instances of the same module are supported (e.g. two email inboxes
# with different credentials).
# ---------------------------------------------------------------------------
sources:
  # Email inbox source — polls Microsoft Graph API for invoice emails
  main_inbox:
    module: email_source
    interval_minutes: 10
    # client_id is inherited from microsoft.client_id if not set here
    # client_id: "your-client-id"
    onedrive_folder_name: "YOUR_FOLDER_NAME_HERE"

    # Optional sender whitelist. If omitted or empty, ALL emails with attachments
    # are scanned — the AI classifier decides what is an invoice.
    # whitelisted_senders:
    #   - "factures@supplier.fr"

    # Subject keyword filter. Only emails whose subject contains at least one of
    # these keywords (case-insensitive) are processed.
    subject_keywords:
      - facture
      - invoice
      - avoir
      - recu
      - receipt
      - facturation
      - paiement
      - payment
      - bill
      - quittance
      - decompte
      - releve
      - cotisation
      - abonnement
      - subscription
      - confirmation de commande
      - order confirmation

    # Keywords used to identify invoice download links in email bodies.
    link_keywords:
      - invoice
      - receipt
      - download
      - bill
      - pdf
      - facture
      - recu
      - telecharger
      - telechargement
      - quittance
      - avoir

  # Example: second inbox with different credentials
  # secondary_inbox:
  #   module: email_source
  #   interval_minutes: 30
  #   client_id: "other-client-id"
  #   onedrive_folder_name: "YOUR_FOLDER_NAME_HERE"

  # Example: web scraper source (triggered externally, no interval_minutes)
  # cegedim:
  #   username: "..."
  #   password_env: "CEGEDIM_PASS"

# ---------------------------------------------------------------------------
# Shared settings
# ---------------------------------------------------------------------------

invoices:
  # Map sender email → canonical supplier name for the classifier hint.
  # sender_suppliers:
  #   "factures@supplier.fr": "Supplier Name"

schedule:
  # Day of month to generate the Excel summary (1 = 1st of the month)
  report_day_of_month: 1

  # Hour (UTC) at which to generate the report
  report_hour: 8

classifier:
  # Model to use for classification via claude CLI (claude -p).
  # Uses your Claude subscription — no API key needed.
  model: "opus"

  # Confidence threshold — below this, files are uploaded anyway (fail-safe)
  confidence_threshold: 0.5

  # Your own business names (the BUYER on invoices, not the supplier).
  # owner_business_names:
  #   - "my restaurant"

debug:
  # If set, only emails received after this date (YYYY-MM-DD) are processed.
  # since_date: "2025-01-01"

logging:
  log_level: INFO
